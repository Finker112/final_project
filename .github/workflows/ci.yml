name: CI Pipeline
on:
  pull_request:
    branches: [dev, staging, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: 代码静态检查
        run: ruff check .

      - name: 运行单元测试
        run: pytest tests/ -v

      - name: 构建Docker镜像
        run: docker build -t taxi-app .